<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Chiede ai motori di ricerca di non indicizzare la pagina -->
<meta name="robots" content="noindex, nofollow">
<title>Una lettera per te</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Courier+Prime:wght@400;700&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --inchiostro:#152238;
    --inchiostro-scuro:#0d1727;
    --carta:#f6f2e8;
    --rosso-posta:#c2402f;
    --blu-posta:#2b4a8b;
    --verde-ok:#2f6b4f;
    --grafite:#6d7787;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 18px 44px;
    background:
      radial-gradient(120% 90% at 50% 0%, #1e3050 0%, var(--inchiostro) 45%, var(--inchiostro-scuro) 100%);
    font-family:"Karla", system-ui, -apple-system, "Segoe UI", sans-serif;
    color:var(--inchiostro);
  }

  /* La busta: bordo a righe da posta aerea */
  .busta{
    width:100%;
    max-width:470px;
    padding:11px;
    border-radius:3px;
    background:
      repeating-linear-gradient(
        45deg,
        var(--rosso-posta) 0 13px,
        #ffffff 13px 26px,
        var(--blu-posta) 26px 39px,
        #ffffff 39px 52px
      );
    box-shadow:0 26px 60px rgba(0,0,0,.45);
  }

  .foglio{
    position:relative;
    background:var(--carta);
    padding:40px 34px 34px;
    border-radius:1px;
    overflow:hidden;
  }

  /* Righe leggere, come carta da lettere */
  .foglio::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(to bottom, transparent 0 31px, rgba(21,34,56,.055) 31px 32px);
    mask-image:linear-gradient(to bottom, transparent 0, #000 30%, #000 100%);
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 30%, #000 100%);
  }

  .foglio > *{position:relative; z-index:1;}

  .occhiello{
    font-family:"Courier Prime", ui-monospace, monospace;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--grafite);
    margin:0 0 14px;
  }

  h1{
    font-family:"Bodoni Moda", Georgia, "Times New Roman", serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(34px, 9vw, 46px);
    line-height:1.04;
    letter-spacing:-.01em;
    margin:0 0 16px;
    max-width:9ch;
  }

  .intro{
    font-size:15.5px;
    line-height:1.6;
    color:#39445a;
    margin:0 0 30px;
    max-width:34ch;
  }

  /* Timbro postale */
  .timbro{
    position:absolute;
    top:24px;
    right:22px;
    width:104px;
    height:104px;
    color:var(--rosso-posta);
    opacity:.72;
    transform:rotate(-13deg);
    animation:timbra .5s cubic-bezier(.2,1.5,.4,1) .45s backwards;
  }

  @keyframes timbra{
    from{opacity:0; transform:rotate(-24deg) scale(1.7);}
    to{opacity:.72; transform:rotate(-13deg) scale(1);}
  }

  .campo{
    display:block;
    font-family:"Courier Prime", ui-monospace, monospace;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--grafite);
    margin-bottom:9px;
  }

  input[type="email"]{
    width:100%;
    padding:15px 16px;
    font-family:"Karla", sans-serif;
    font-size:16.5px;
    color:var(--inchiostro);
    background:#fffdf8;
    border:1px solid rgba(21,34,56,.28);
    border-radius:2px;
  }

  input[type="email"]::placeholder{color:#a4abb8;}
  input[type="email"]:hover{border-color:rgba(21,34,56,.5);}

  button{
    width:100%;
    margin-top:14px;
    padding:16px 18px;
    font-family:"Karla", sans-serif;
    font-size:16px;
    font-weight:600;
    color:var(--carta);
    background:var(--inchiostro);
    border:none;
    border-radius:2px;
    cursor:pointer;
    transition:background .18s ease, transform .18s ease;
  }

  button:hover:not(:disabled){background:#22375c;}
  button:active:not(:disabled){transform:translateY(1px);}
  button:disabled{opacity:.55; cursor:default;}

  :focus-visible{
    outline:2.5px solid var(--rosso-posta);
    outline-offset:3px;
  }

  .avviso{
    margin:14px 0 0;
    font-size:14.5px;
    line-height:1.55;
    min-height:22px;
  }

  .avviso.errore{color:var(--rosso-posta);}
  .avviso.fatto{color:var(--verde-ok);}

  .piede{
    margin:26px 0 0;
    padding-top:16px;
    border-top:1px solid rgba(21,34,56,.14);
    font-family:"Courier Prime", ui-monospace, monospace;
    font-size:11.5px;
    line-height:1.6;
    color:var(--grafite);
  }

  @media (max-width:420px){
    .foglio{padding:32px 22px 26px;}
    .timbro{width:78px; height:78px; top:18px; right:14px;}
    h1{max-width:7ch;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

  <main class="busta">
    <div class="foglio">

      <!-- Timbro postale: cambia le scritte se vuoi -->
      <svg class="timbro" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <path id="giro" d="M50,50 m-37,0 a37,37 0 1,1 74,0 a37,37 0 1,1 -74,0"></path>
        </defs>
        <circle cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="2"></circle>
        <circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="1"></circle>
        <text font-family="Courier Prime, monospace" font-size="8.5" letter-spacing="2.2" fill="currentColor">
          <textPath href="#giro" xlink:href="#giro" startOffset="6%">CONSEGNA A MANO · POSTA PERSONALE ·</textPath>
        </text>
        <text x="50" y="47" text-anchor="middle" font-family="Courier Prime, monospace" font-size="12" font-weight="700" fill="currentColor">2026</text>
        <text x="50" y="59" text-anchor="middle" font-family="Courier Prime, monospace" font-size="7" letter-spacing="1.5" fill="currentColor">GRAZIE</text>
      </svg>

      <p class="occhiello">Un ricordo della nostra esperienza</p>
      <h1>Una lettera per te</h1>
      <p class="intro">Ho scritto qualcosa per ognuno di voi. Scrivi qui il tuo indirizzo: la tua lettera arriva nella tua posta, solo a te.</p>

      <label class="campo" for="email">Il tuo indirizzo mail</label>
      <input type="email" id="email" placeholder="nome@esempio.it"
             autocomplete="email" inputmode="email" spellcheck="false">

      <button id="invia" type="button">Mandami la mia lettera</button>
      <p class="avviso" id="avviso" role="status" aria-live="polite"></p>

      <p class="piede">
        La mail arriva in un paio di minuti.<br>
        Se non la vedi, controlla nello spam.
      </p>

    </div>
  </main>

<script>
  /* ============================================================
     ↓↓↓  L'UNICA RIGA DA MODIFICARE  ↓↓↓

     Incolla qui l'indirizzo che Google ti dà quando pubblichi
     lo script come app web. Finisce con /exec
     ============================================================ */

  const URL_SCRIPT = "INCOLLA_QUI_L_INDIRIZZO_DELLO_SCRIPT";

  /* ↑↑↑  Da qui in giù non serve toccare niente  ↑↑↑ */

  const campoEmail = document.getElementById("email");
  const pulsante = document.getElementById("invia");
  const avviso = document.getElementById("avviso");

  function mostra(testo, tipo) {
    avviso.textContent = testo;
    avviso.className = "avviso" + (tipo ? " " + tipo : "");
  }

  async function richiediLettera() {
    const email = campoEmail.value.trim();

    if (!email || !email.includes("@") || !email.includes(".")) {
      mostra("Controlla l'indirizzo: sembra incompleto.", "errore");
      campoEmail.focus();
      return;
    }

    pulsante.disabled = true;
    pulsante.textContent = "Invio in corso…";
    mostra("");

    try {
      // Content-Type "text/plain" di proposito: evita il controllo
      // preventivo del browser, che Google Apps Script non gestisce.
      await fetch(URL_SCRIPT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ email: email }),
        redirect: "follow"
      });

      // Risposta volutamente neutra: non rivela chi è nella lista.
      mostra("Fatto. Se l'indirizzo è nella lista, tra poco trovi la lettera nella tua posta.", "fatto");
      campoEmail.value = "";
    } catch (errore) {
      mostra("Qualcosa non ha funzionato. Riprova tra un minuto.", "errore");
      console.error(errore);
    } finally {
      pulsante.disabled = false;
      pulsante.textContent = "Mandami la mia lettera";
    }
  }

  pulsante.addEventListener("click", richiediLettera);

  campoEmail.addEventListener("keydown", function (evento) {
    if (evento.key === "Enter") richiediLettera();
  });

  campoEmail.addEventListener("input", function () {
    if (avviso.textContent) mostra("");
  });
</script>

</body>
</html>
